info:
  name: update
  type: http

http:
  method: PUT
  url: http://localhost:8080/api/produtos/1?nome=Camisola Azul&preco=24.99&stock=5&categoria=roupa
  params:
    - name: nome
      value: Camisola Azul
      type: query
    - name: preco
      value: "24.99"
      type: query
    - name: stock
      value: "5"
      type: query
    - name: categoria
      value: roupa
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
