info:
  name: PostEncomenda
  type: http

http:
  method: POST
  url: http://localhost:8080/api/encomendas?estado=Pendente&preco_total=40&idComprador=1&idProduto=1&idProduto=3
  params:
    - name: estado
      value: Pendente
      type: query
    - name: preco_total
      value: "40"
      type: query
    - name: idComprador
      value: "1"
      type: query
    - name: idProduto
      value: "1"
      type: query
    - name: idProduto
      value: "3"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
