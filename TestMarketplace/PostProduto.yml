  url: http://localhost:8080/api/produtos?nome=Camisola&preco=59.99&stock=10&categoria=roupa&idVendedor=1
  params:
    - name: nome
      value: Camisola
      type: query
    - name: preco
      value: "59.99"
      type: query
    - name: stock
      value: "10"
      type: query
