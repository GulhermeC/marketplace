<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - Marketplace</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="navbar">
      <a href="index.html" class="logo">Marketplace</a>

      <nav>
        <a href="index.html">Home</a>
        <a href="index.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main>
      <h1>Create Account</h1>

      <form id="registerForm">
        <label for="nome">Name</label>
        <input type="text" id="nome" name="nome" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <label for="numTele">Phone</label>
        <input type="number" id="numTele" name="numTele" required />

        <label for="local">Location</label>
        <input type="text" id="local" name="local" required />

        <label for="tipo">Account Type</label>
        <select id="tipo" name="tipo" required>
          <option value="Comprador">Buyer</option>
          <option value="Vendedor">Seller</option>
        </select>

        <button type="submit">Register</button>

        <p id="registerMessage"></p>
      </form>
    </main>

    <script src="js/register.js"></script>
  </body>
</html>
