<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">Marketplace</a>

      <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
        <a href="login.html" id="loginLink">Login</a>
      </nav>
    </header>

    <main class="cart-page">
      <div class="cart-container">
        <h1>My Orders</h1>
        <div id="orderSuccessMessage" class="order-success-message" hidden>
          Payment completed successfully!
        </div>
        <div id="ordersContainer"></div>
        <div id="paymentModal" class="payment-modal" hidden>
          <div class="payment-modal-content">
            <h2>Payment</h2>
            <p id="paymentOrderId"></p>
            <p id="paymentTotal"></p>
            <button type="button" id="confirmPaymentButton">
              Confirm payment
            </button>
            <button type="button" id="closePaymentButton">Cancel</button>
          </div>
        </div>
      </div>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/orders.js"></script>
  </body>
</html>
