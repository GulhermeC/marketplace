<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Marketplace</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="login.html" id="loginLink">Login</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to the Marketplace</h1>
        <p>Buy and sell products between users.</p>

        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >
            <button id="searchButton">Search</button>
        </div>
    </section>

    <section class="products-section">
        <h2>Products</h2>

        <div id="productsContainer" class="products-container"></div>
    </section>

    <a href="post-product.html" class="add-product-button" id="addProductButton">+</a>

    <script src="js/app.js"></script>
</body>
</html>
